name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Unit tests and JS compilation
        run: ./gradlew :KuiklyChart:jsNodeTest :shared:compileKotlinJs --stacktrace

      - name: Build H5
        run: ./gradlew :h5App:jsBrowserProductionWebpack --stacktrace

      - name: Build Android debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace