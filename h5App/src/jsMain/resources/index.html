<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Kuikly Finance Charts — Mock stock market and AI analysis demo">
  <title>Kuikly Finance</title>
  <style>
    :root { color-scheme: dark; background: #07111f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; min-height: 100%; background: #07111f; }
    body { overflow: hidden; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    #root { height: 100vh; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #8ea0b8; background:
        linear-gradient(rgba(30,48,71,.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,48,71,.16) 1px, transparent 1px),
        #07111f;
      background-size: 32px 32px; font: 12px/1.5 ui-monospace, monospace;
      letter-spacing: .16em;
    }
    #boot::before {
      content: ""; width: 38px; height: 38px; margin-right: 14px;
      border: 2px solid #1e3047; border-top-color: #20c997; border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .list-no-scrollbar { scrollbar-width: none; }
    .list-no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">INITIALIZING MARKET LAB</div>
  <script src="h5App.js"></script>
</body>
</html>
